<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureX — Investigation Workspace</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --critical: #f85149;
      --high: #d29922;
      --low: #3fb950;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 24px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { font-size: 20px; font-weight: 600; }
    h1 span { color: var(--accent); }
    .status { font-size: 12px; color: var(--muted); }
    .status.ok::before { content: "● "; color: var(--low); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }
    .stat-card .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 32px; font-weight: 600; margin-top: 4px; }
    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel h2 {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    ul { list-style: none; max-height: 400px; overflow-y: auto; }
    li { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
    li:last-child { border-bottom: none; }
    li .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .badge.critical { background: rgba(248,81,73,0.15); color: var(--critical); }
    .badge.high { background: rgba(210,153,34,0.15); color: var(--high); }
    .badge.low { background: rgba(63,185,80,0.15); color: var(--low); }
    .muted { color: var(--muted); font-size: 12px; }
    .empty { padding: 24px; text-align: center; color: var(--muted); font-size: 13px; }
    .timeline { padding-left: 12px; border-left: 2px solid var(--border); margin-left: 6px; }
    .timeline li { position: relative; }
    .timeline li::before {
      content: "";
      position: absolute;
      left: -18px;
      top: 18px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1><span>SecureX</span> — Investigation Workspace</h1>
    <div class="status ok" id="api-status">API Connected</div>
  </header>

  <div class="stats">
    <div class="stat-card"><div class="label">Open Incidents</div><div class="value" id="incident-count">–</div></div>
    <div class="stat-card"><div class="label">Detections</div><div class="value" id="detection-count">–</div></div>
    <div class="stat-card"><div class="label">Queued Events</div><div class="value" id="event-count">–</div></div>
  </div>

  <div class="layout">
    <div class="panel">
      <h2>Incidents</h2>
      <ul id="incidents"><li class="empty">No incidents yet</li></ul>
    </div>
    <div class="panel">
      <h2>Detections</h2>
      <ul id="detections"><li class="empty">No detections yet</li></ul>
    </div>
    <div class="panel" style="grid-column: 1 / -1;">
      <h2>Attack Timeline — Latest Incident</h2>
      <ul id="timeline" class="timeline"><li class="empty">No incident selected</li></ul>
    </div>
  </div>

  <script>
    const API = window.location.origin;

    function sevBadge(sev) {
      if (sev >= 7) return '<span class="badge critical">CRITICAL</span>';
      if (sev >= 4) return '<span class="badge high">HIGH</span>';
      return '<span class="badge low">LOW</span>';
    }

    async function refresh() {
      try {
        const [health, incRes, detRes] = await Promise.all([
          fetch(`${API}/health`),
          fetch(`${API}/api/v1/incidents`),
          fetch(`${API}/api/v1/detections-summary`).catch(() => null),
        ]);

        document.getElementById('api-status').textContent =
          health.ok ? 'API Connected' : 'API Error';

        const { incidents } = await incRes.json();
        document.getElementById('incident-count').textContent = incidents.length;

        if (incidents.length === 0) {
          document.getElementById('incidents').innerHTML = '<li class="empty">No incidents yet</li>';
          document.getElementById('timeline').innerHTML = '<li class="empty">No incident selected</li>';
        } else {
          document.getElementById('incidents').innerHTML = incidents
            .slice().reverse()
            .map((i) => `
              <li>
                <div class="row">
                  <strong>${i.name}</strong>
                  ${sevBadge(i.severity)}
                </div>
                <div class="muted">${i.id} · ${new Date(i.lastSeen).toLocaleTimeString()} · ${i.matchedEvents.length} events · ${i.status}</div>
              </li>`).join('');

          const latest = incidents[incidents.length - 1];
          document.getElementById('timeline').innerHTML = latest.matchedEvents
            .map((e) => `
              <li>
                <div class="row">
                  <strong>${e.type}</strong>
                  ${sevBadge(e.severity ?? 1)}
                </div>
                <div class="muted">${new Date(e.timestamp).toLocaleString()} · source: ${e.source}</div>
              </li>`).join('');
        }

        // Detections come from Redis-backed endpoint
        const detResp = await fetch(`${API}/api/v1/detections?count=50`);
        if (detResp.ok) {
          const { detections } = await detResp.json();
          document.getElementById('detection-count').textContent = detections.total ?? detections.detections.length;
          document.getElementById('detections').innerHTML =
            detections.detections.length === 0
              ? '<li class="empty">No detections yet</li>'
              : detections.detections.slice().reverse().map((d) => `
                  <li>
                    <div class="row"><strong>${d.description}</strong>${sevBadge(d.severity)}</div>
                    <div class="muted">${new Date(d.timestamp).toLocaleTimeString()}</div>
                  </li>`).join('');
        }
      } catch (err) {
        document.getElementById('api-status').textContent = 'API Offline';
      }
    }

    refresh();
    setInterval(refresh, 3000);
  </script>
</body>
</html>
